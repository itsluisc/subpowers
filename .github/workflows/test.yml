name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Pillow ${{ matrix.pillow && 'installed' || 'hidden' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, pillow: true }
          - { os: ubuntu-latest, pillow: false }
          - { os: macos-latest, pillow: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure decoder for Python and shell tests
        run: |
          if [ "${{ matrix.pillow }}" = "true" ]; then
            python3 -m pip install Pillow
          else
            python3 -m pip uninstall -y Pillow
          fi
      - name: bash -n every shell script
        run: |
          for f in bin/* tests/run.sh install.sh; do
            if head -n 1 "$f" | grep -q bash; then /bin/bash -n "$f" || exit 1; echo "ok  $f"; fi
          done
      - name: Offline Python contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: tests/run.sh, sips hidden
        run: /bin/bash tests/run.sh
        env:
          SUBPOWERS_TEST_NO_PILLOW: ${{ !matrix.pillow && '1' || '' }}
      - name: tests/run.sh, sips present
        if: runner.os == 'macOS'
        run: /bin/bash tests/run.sh
        env:
          SUBPOWERS_TEST_SIPS: '1'
          SUBPOWERS_TEST_NO_PILLOW: '1'
